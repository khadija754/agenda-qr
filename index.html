<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de l'association</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: #333333;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .boutons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 500;
            text-decoration: none;
            border: 2px solid #333333;
            color: #333333;
            background-color: #ffffff;
            border-radius: 8px;
            transition: none;
        }

        .btn:active {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ========================================== -->
        <!-- MODIFIEZ ICI : Nom de l'association        -->
        <!-- ========================================== -->
        <h1>مؤسسة سيدة الأرض</h1>

        <div class="boutons">

            <!-- ========================================== -->
            <!-- MODIFIEZ ICI : Nom du fichier PDF          -->
            <!-- Par défaut : agenda.pdf (même dossier)     -->
            <!-- ========================================== -->
            <a href="agenda.pdf" class="btn" target="_blank">
                📖 Consulter l'agenda numérique
            </a>

            <!-- ========================================== -->
            <!-- MODIFIEZ ICI : Lien de la page Facebook    -->
            <!-- ========================================== -->
            <a href="https://www.facebook.com/share/1MMvS6DXNy/?mibextid=wwXIfr" class="btn" target="_blank" rel="noopener noreferrer">
                📘 Page Facebook
            </a>

        </div>

    </div>
</body>
</html>
